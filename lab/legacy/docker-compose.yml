name: ll

services:
  mongo:
    image: mongo:4.2
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - ll_mongo_legacy:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:4
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ll_redis_legacy:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  ll_mongo_legacy:
  ll_redis_legacy:
